name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            film-randomized/package-lock.json
            film-randomized-back/package-lock.json
      - name: Test frontend
        working-directory: film-randomized
        run: |
          npm ci
          npm test -- --run
          npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      - name: Test backend
        working-directory: film-randomized-back
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

  deploy:
    name: Deploy App Platform
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application
        uses: digitalocean/app_action/deploy@v2
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          MAILTRAP_TOKEN: ${{ secrets.MAILTRAP_TOKEN }}
          MAILTRAP_SENDER_EMAIL: ${{ secrets.MAILTRAP_SENDER_EMAIL }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yaml
          print_build_logs: true
          print_deploy_logs: true
