name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            film-randomized/package-lock.json
            film-randomized-back/package-lock.json
      - name: Test frontend
        working-directory: film-randomized
        run: |
          npm ci
          npm test -- --run
          npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      - name: Test backend
        working-directory: film-randomized-back
        run: |
          npm ci
          npm test -- --runInBand
          npm run build
