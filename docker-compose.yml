services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: film_randomized
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 8

  app:
    build:
      context: .
      args:
        VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY:?set VITE_TMDB_API_KEY in .env}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/film_randomized
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 characters)}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

volumes:
  pgdata:
